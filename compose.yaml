services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workbench-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  ui:
    build: .
    command: ["streamlit", "run", "src/lab_workbench/ui.py", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      WORKBENCH_API: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  workbench-data:
